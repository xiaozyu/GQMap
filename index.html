    function focusCurrentTaskOnMap() {
      if (tasks.length === 0 || currentIndex < 0 || currentIndex >= tasks.length) return;
      const t = tasks[currentIndex];
      const wgs = getTaskLatLng(t);
      if (wgs) {
        map.flyTo([wgs.lat, wgs.lng], isCadOverlayEnabled ? 18 : 16, { duration: 0.4 });
      }
    }

    const COORD_REGEX = /[A-Za-z]?[0-9]{4}\s*[A-Za-z]{2}\s*(?:[0-9]{4}|[0-9]{2})/gi;
    const TIME_REGEX = /(\d{1,2}):?(\d{2})?\s*[-~～]\s*(\d{1,2}):?(\d{2})?/;

    function formatTimeStandard(lineText) {
      const match = lineText.match(TIME_REGEX);
      if (match) {
        const startH = String(match[1]).padStart(2, '0');
        const endH = String(match[3]).padStart(2, '0');
        return `${startH}-${endH}`;
      }
      return '';
    }

    function isSystemNoiseLine(line) {
      const noiseKeywords = [
        "每頁", "施工地點", "領班", "預定施工日期", "承攬商",
        "請選擇", "施工號碼", "工程類別", "施工時間", "工作內容",
        "接戶線工作", "篩選條件", "DCIS", "工區別", "查驗作業", "綜合查詢", "工安查核"
      ];
      if (noiseKeywords.some(w => line.includes(w))) return true;
      if (/^\d{2,4}\/\d{1,2}\/\d{1,2}$/.test(line)) return true;
      if (/^[\u4e00-\u9fa5]{2,4}$/.test(line) && !/[路街巷段號樓區鄉鎮市縣村里鄰]/.test(line)) return true;
      return false;
    }

    function parseSingleTaskLine(rawText, defaultPrefix = 'G') {
      if (!rawText) return { code: '', time: '', note: '', isND: false };
      let text = rawText.trim();

      let isND = false;
      const ndRegex = /(?:^|[\s\[\(0-9])(nd)(?:$|[\s\]\)0-9])/i;
      if (/\bnd\b/i.test(text) || /\[nd\]/i.test(text) || ndRegex.test(text) || /nd$/i.test(text) || /^nd/i.test(text)) {
        isND = true;
        text = text.replace(/\[?nd\]?/gi, ' ').trim();
      }

      let code = '';
      COORD_REGEX.lastIndex = 0;
      let codeMatch = text.match(COORD_REGEX);
      if (codeMatch) {
        let rawCode = codeMatch[0].replace(/\s+/g, '').toUpperCase();
        if (/^[0-9]/.test(rawCode)) rawCode = (defaultPrefix || 'G') + rawCode;
        code = sanitizeTaipowerCode(rawCode);
        text = text.replace(codeMatch[0], ' ').trim();
      } else {
        let tokens = text.split(/[\s,]+/);
        for (let tk of tokens) {
          let cleanTk = tk.toUpperCase().replace(/[^A-Z0-9]/g, '');
          if (cleanTk.length >= 8 && cleanTk.length <= 11 && /[A-Z]/.test(cleanTk) && /\d{3,}/.test(cleanTk) && !/[路街巷段號]/.test(tk)) {
            let rawCode = /^[0-9]/.test(cleanTk) ? (defaultPrefix || 'G') + cleanTk : cleanTk;
            code = sanitizeTaipowerCode(rawCode);
            text = text.replace(tk, ' ').trim();
            break;
          }
        }
      }

      let time = '';
      let dashTimeMatch = text.match(/(?:^|\D)(\d{1,2})(?::\d{2})?\s*[-~～]\s*(\d{1,2})(?::\d{2})?(?!\d)/);
      if (dashTimeMatch) {
        let h1 = parseInt(dashTimeMatch[1], 10);
        let h2 = parseInt(dashTimeMatch[2], 10);
        if (h1 >= 0 && h1 <= 24 && h2 >= 0 && h2 <= 24) {
          time = `${String(h1).padStart(2, '0')}-${String(h2).padStart(2, '0')}`;
          text = text.replace(dashTimeMatch[0], ' ').trim();
        }
      } else {
        let compactTimeRegex = /(?:^|\s)([0-2]\d)([0-2]\d)(?!\s*[號樓巷弄段Ff])(?=\s|$)/;
        let m = text.match(compactTimeRegex);
        if (m) {
          let h1 = parseInt(m[1], 10);
          let h2 = parseInt(m[2], 10);
          if (h1 >= 0 && h1 <= 23 && h2 >= 0 && h2 <= 24 && h1 < h2) {
            time = `${String(h1).padStart(2, '0')}-${String(h2).padStart(2, '0')}`;
            text = text.replace(m[0], ' ').trim();
          }
        }
      }

      let note = cleanAndFixAddress(text);
      note = note.replace(/^\d{1,4}\s+/, '').replace(/\s+\d{1,4}$/, '').trim();
      if (/^\d{1,4}$/.test(note)) note = '';

      return { code, time, note, isND };
    }

    async function parseText(content) {
      if (!content || !content.trim()) return;

      const rawLines = content.split(/[\r\n]+/).map(l => l.trim()).filter(Boolean);
      const newTasks = [];

      // ★ 時間配對：Google 複製出來的順序常常是「好幾個時間排在一起，地址排在後面」，
      //   也可能是「時間接著地址」。統一用先進先出：每出現一個單獨的時間就排進佇列，
      //   每出現一筆案件就拿走最早排隊的那個時間。
      const timeQueue = [];

      let currentTime = '';
      let pendingNote = '';

      for (let i = 0; i < rawLines.length; i++) {
        let line = rawLines[i];
        COORD_REGEX.lastIndex = 0;
        const hasCoord = COORD_REGEX.test(line);
        const timeStr = formatTimeStandard(line);

        if (!hasCoord && !timeStr && isSystemNoiseLine(line)) continue;

        if (timeStr && !hasCoord) {
          timeQueue.push(timeStr);
          currentTime = timeStr;
          continue;                      // 單獨的時間行，只排隊
        }
        if (timeStr) currentTime = timeStr;

        COORD_REGEX.lastIndex = 0;
        let matches = line.match(COORD_REGEX);
        if (matches) {
          const parsedLine = parseSingleTaskLine(line, 'G');
          const assignedTime = parsedLine.time || timeStr || timeQueue.shift() || currentTime;

          matches.forEach(m => {
            let rawCode = m.replace(/\s+/g, '').toUpperCase();
            const cleanCode = sanitizeTaipowerCode(rawCode);

            let note = parsedLine.note;
            if (!note && pendingNote && !isSystemNoiseLine(pendingNote)) {
              note = cleanAndFixAddress(pendingNote);
            }

            const isND = parsedLine.isND || /\bnd\b/i.test(note);

            if (cleanCode && !tasks.some(t => t.code === cleanCode) && !newTasks.some(t => t.code === cleanCode)) {
              newTasks.push({
                code: cleanCode,
                time: assignedTime,
                note: note || '',
                isND: isND
              });
            }
          });
          pendingNote = '';
        } else if (line && !timeStr && !isSystemNoiseLine(line)) {
          if (/[路街巷段號]/.test(line)) {
            newTasks.push({
              code: '📍地址導航',
              time: timeStr || timeQueue.shift() || currentTime,
              note: cleanAndFixAddress(line),
              isND: /nd/i.test(line),
              lat: null,
              lng: null
            });
          } else {
            pendingNote = line;
          }
        }
      }

      if (newTasks.length === 0) {
        // 只複製一件時：格式常常不像整張派工單 → 比照下方輸入框的處理方式（圖號或地址都吃）
        const cand = rawLines.filter(l => !isSystemNoiseLine(l) && !formatTimeStandard(l));
        if (cand.length >= 1 && cand.length <= 2) {
          const one = cand.join(' ').slice(0, 60);
          const t0 = rawLines.map(formatTimeStandard).find(Boolean) || null;
          let ok = false;
          try { ok = await processAndSaveTaskInput(t0 ? one + ' ' + t0 : one, null, 'G'); } catch (e) {}
          if (ok) return;
        }
        showUndoToast('匯入沒有新增案件（內容已存在或格式看不出圖號／地址）', null);
        return;
      }
      if (newTasks.length > 0) {
        const startIndex = tasks.length;
        newTasks.forEach(n => { if (n.code === '📍地址導航') geoPending.add(n); });
        tasks.push(...newTasks);
        saveTasks();
        renderTasks(true);
        selectTask(startIndex, false, false);

        for (let taskItem of newTasks) {
          if (taskItem.code === '📍地址導航' && !taskItem.lat) {
            const ok = await geocodeTask(taskItem);
            renderTasks(ok);
            continue;
          }
          const rawNoteCheck = cleanAndFixAddress(taskItem.note || '');
          if (rawNoteCheck.length < 3 || !/[路街巷段號]/.test(rawNoteCheck)) {
            taskItem.code = sanitizeTaipowerCode(taskItem.code);
            const twd67 = taipowerToTWD67(taskItem.code);
            if (twd67) {
              const wgs = twd67ToWGS84(twd67[0], twd67[1]);
              const road = await fetchCleanAddress(wgs.lat, wgs.lng);
              if (road) {
                taskItem.note = road;
                saveTasks();
                renderTasks();
              } else if (!taskItem.note) {
                taskItem.note = '施工地點';
                saveTasks();
                renderTasks();
              }
            }
          }
        }
      }
    }

    const manualCodeInput = document.getElementById('manual-code-input');
    const btnManualAdd = document.getElementById('btn-manual-add');
    const prefixBadge = document.getElementById('prefix-badge');

    function bindPrefixInputBehavior(inputEl, badgeEl) {
      inputEl.addEventListener('input', () => {
        let val = inputEl.value;
        let trimmed = val.trimStart();
        if (/^[A-Za-z][0-9]/.test(trimmed)) {
          let upper = trimmed.toUpperCase();
          if (/^[A-W][0-9]/.test(upper)) {
            badgeEl.innerText = upper[0];
            inputEl.value = trimmed.substring(1);
          }
        } else if (/^[\u4e00-\u9fa5]/.test(trimmed) || /[路街巷段號]/.test(trimmed)) {
          badgeEl.innerText = '📍';
        } else if (!trimmed) {
          badgeEl.innerText = 'G';
        }
      });
    }

    bindPrefixInputBehavior(manualCodeInput, prefixBadge);

    async function processAndSaveTaskInput(rawInput, targetIndex = null, activePrefix = 'G') {
      if (!rawInput || !rawInput.trim()) return false;

      const isEditing = (targetIndex !== null && targetIndex >= 0 && targetIndex < tasks.length);
      const oldTask = isEditing ? tasks[targetIndex] : null;

      const effectivePrefix = (activePrefix === '📍') ? 'G' : (activePrefix || 'G');
      let parsed = parseSingleTaskLine(rawInput, effectivePrefix);
      let finalCode = parsed.code;

      if (!finalCode && isEditing && oldTask && !parsed.note) {
        finalCode = oldTask.code;
      }

      if ((!finalCode || finalCode.length < 9) && (parsed.note || /[路街巷段號]/.test(rawInput))) {
        const addrQuery = parsed.note || cleanAndFixAddress(rawInput);
        let taskObj = {
          code: '📍地址導航',
          time: parsed.time || (isEditing && oldTask ? oldTask.time : ''),
          note: addrQuery,
          isND: parsed.isND || /nd/i.test(rawInput),
          lat: null,
          lng: null
        };

        if (isEditing) {
          tasks[targetIndex] = taskObj;
        } else {
          tasks.push(taskObj);
          targetIndex = tasks.length - 1;
        }

        geoPending.add(taskObj);
        saveTasks();
        renderTasks(true);
        selectTask(targetIndex, false, false);

        const ok = await geocodeTask(taskObj);
        renderTasks(true);
        const ti = tasks.indexOf(taskObj);
        if (ti >= 0) {
          selectTask(ti, true, ok);
          if (!ok) startPickLocation(ti);   // 查不到：直接進入「點地圖標位置」
        }
        return true;
      }

      if (!finalCode || finalCode.length < 9) return false;

      const isSameCode = isEditing && oldTask && (oldTask.code === finalCode);
      let initialNote = parsed.note;

      if (!initialNote) {
        if (isSameCode && oldTask.note && !oldTask.note.includes('查詢地址')) {
          initialNote = cleanAndFixAddress(oldTask.note).replace(/^\d{1,4}\s*/, '');
        } else {
          initialNote = '查詢地址中...';
        }
      }

      let taskObj = {
        code: finalCode,
        time: parsed.time,
        note: initialNote || '查詢地址中...',
        isND: parsed.isND
      };

      if (isEditing) {
        tasks[targetIndex] = taskObj;
      } else {
        tasks.push(taskObj);
        targetIndex = tasks.length - 1;
      }

      saveTasks();
      renderTasks(true);
      selectTask(targetIndex, true, false);

      const twd67 = taipowerToTWD67(finalCode);
      if (twd67 && (!taskObj.note || taskObj.note === '查詢地址中...' || taskObj.note === '施工地點')) {
        const wgs = twd67ToWGS84(twd67[0], twd67[1]);
        const road = await fetchCleanAddress(wgs.lat, wgs.lng);
        taskObj.note = road || '施工地點';
        saveTasks();
        renderTasks(true);
      }
      return true;
    }

    async function handleManualAdd() {
      let rawInput = manualCodeInput.value.trim();
      if (!rawInput) return;

      let currentPrefix = prefixBadge.innerText.toUpperCase() || 'G';
      let success = await processAndSaveTaskInput(rawInput, null, currentPrefix);
      if (success) {
        manualCodeInput.value = '';
        prefixBadge.innerText = 'G';
      } else {
        alert("請輸入有效圖號（如 3850HE23）或地址！");
      }
    }

    btnManualAdd.onclick = handleManualAdd;
    manualCodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleManualAdd();
    });

    let editingTaskIndex = null;

    function ensureEditModalExists() {
      let modal = document.getElementById('task-edit-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'task-edit-modal';
        modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:3000;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);`;
        modal.innerHTML = `
          <div style="background:#1e293b;border:1px solid #475569;border-radius:12px;width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,0.6);">
            <div style="display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#38bdf8;font-size:1.05rem;border-bottom:1px solid #334155;padding-bottom:8px;">
              <span>✏️ 快速修改工單</span>
              <button id="modal-close-x" style="background:none;border:none;color:#cbd5e1;font-size:1.3rem;cursor:pointer;">✕</button>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px;">
              <label style="font-size:0.8rem;color:#94a3b8;font-weight:bold;">支援圖號或中文地址修改：</label>
              <div class="manual-input-bar" style="padding:6px 8px;background:#0f172a;border:1px solid #38bdf8;">
                <span id="edit-prefix-badge" class="prefix-badge">G</span>
                <input type="text" id="edit-modal-line-input" class="manual-input" style="font-size:1.05rem;" placeholder="如: 3850HE23 或 永寧路185巷11號" autocomplete="off" autocorrect="off" spellcheck="false">
              </div>
            </div>

            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;">
              <button id="modal-btn-cancel" style="background:#475569;border:none;color:#fff;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;">取消</button>
              <button id="modal-btn-save" style="background:#16a34a;border:none;color:#fff;padding:8px 20px;border-radius:6px;font-weight:bold;cursor:pointer;">儲存修改</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        const editInputEl = document.getElementById('edit-modal-line-input');
        const editBadgeEl = document.getElementById('edit-prefix-badge');
        bindPrefixInputBehavior(editInputEl, editBadgeEl);

        document.getElementById('modal-close-x').onclick = closeEditModal;
        document.getElementById('modal-btn-cancel').onclick = closeEditModal;
        document.getElementById('modal-btn-save').onclick = saveEditModalData;
        editInputEl.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') saveEditModalData();
        });
      }
      return modal;
    }

    function closeEditModal() {
      const modal = document.getElementById('task-edit-modal');
      if (modal) modal.style.display = 'none';
      editingTaskIndex = null;
    }

    window.editTaskLineInline = (idx, event) => {
      event.stopPropagation();
      editingTaskIndex = idx;
      const t = tasks[idx];

      const modal = ensureEditModalExists();
      const editBadgeEl = document.getElementById('edit-prefix-badge');
      const editInputEl = document.getElementById('edit-modal-line-input');

      if (t.code === '📍地址導航') {
        editBadgeEl.innerText = '📍';
        let parts = [t.note || ''];
        if (t.time) parts.push(t.time);
        if (t.isND) parts.push('ND');
        editInputEl.value = parts.join(' ');
      } else {
        const fullCode = sanitizeTaipowerCode(t.code);
        const prefixChar = /^[A-Z]/.test(fullCode) ? fullCode[0] : 'G';
        const bodyCode = /^[A-Z]/.test(fullCode) ? fullCode.substring(1) : fullCode;

        editBadgeEl.innerText = prefixChar;

        let parts = [bodyCode];
        if (t.time) parts.push(t.time);
        if (t.isND) parts.push('ND');

        editInputEl.value = parts.join(' ');
      }

      modal.style.display = 'flex';
      setTimeout(() => {
        editInputEl.focus();
        editInputEl.select();
      }, 80);
    };

    async function saveEditModalData() {
      if (editingTaskIndex === null || editingTaskIndex < 0 || editingTaskIndex >= tasks.length) {
        closeEditModal();
        return;
      }

      const editBadgeEl = document.getElementById('edit-prefix-badge');
      const editInputEl = document.getElementById('edit-modal-line-input');
      let rawInput = editInputEl.value.trim();
      if (!rawInput) {
        alert("輸入內容不可為空！");
        return;
      }

      let activePrefix = editBadgeEl.innerText.toUpperCase() || 'G';
      let success = await processAndSaveTaskInput(rawInput, editingTaskIndex, activePrefix);
      if (success) {
        closeEditModal();
      } else {
        alert("格式錯誤！");
      }
    }

    let sortableInstance = null;

    function renderTasks(fitMap = false) {
      taskList.innerHTML = '';
      updateDateBar();
      if (tasks.length === 0) {
        taskList.innerHTML = `<div style="color:#64748b;font-size:0.8rem;padding:4px;">${activeDate === todayKey ? '今天還沒有案件' : activeDate + ' 沒有案件'}，可輸入圖號、中文地址或按「📋 匯入」。</div>`;
        markersLayer.clearLayers();
        routeLayer.clearLayers();
        return;
      }

      tasks.forEach((t, idx) => {
        if (t.code !== '📍地址導航') {
          t.code = sanitizeTaipowerCode(t.code);
        }
        const isND = Boolean(t.isND || /nd/i.test(t.note || ''));
        t.isND = isND;
        if (t.note) t.note = cleanAndFixAddress(t.note);

        const row = document.createElement('div');
        row.className = `task-row ${idx === currentIndex ? 'active' : ''} ${isND ? 'nd-case' : ''}`;

        const timeBadgeHtml = t.time ? `<span class="task-time-badge">${t.time}</span>` : '<span class="task-time-badge" style="opacity:0.2;">--:--</span>';
        const cleanNote = cleanAndFixAddress(t.note || '');
        const displayTitle = (t.code === '📍地址導航') ? cleanNote : t.code;
        const displayDesc = isND ? `ND ${cleanNote || '施工地點'}` : (cleanNote || '施工地點');

        const isAddr = (t.code === '📍地址導航');
        let addrStatus = '(地址導航)';
        if (isAddr) {
          if (geoPending.has(t)) addrStatus = '⏳ 定位中…';
          else if (typeof t.lat !== 'number') addrStatus = '⚠ 未定位 → 按📌標點';
          else if (t.manual) addrStatus = '📌 已手動標點';
          else if (t.approx !== false) addrStatus = '≈ 約略位置';
          else addrStatus = '✓ 已定位';
          if (typeof t.lat === 'number' && typeof t.lng === 'number') addrStatus += ' · ' + coordToPowerCode(t.lat, t.lng);
        }

        row.innerHTML = `
          <div class="task-left">
            <span class="drag-handle">☰</span>
            <span class="task-num-label">#${idx + 1}</span>
            ${timeBadgeHtml}
            <span class="task-title">${displayTitle}</span>
            <span class="task-desc">${isAddr ? addrStatus : displayDesc}</span>
          </div>
          <div class="row-actions">
            ${isAddr ? `<button class="btn-pick-row" onclick="startPickLocation(${idx}, event)" title="在地圖上點選位置">📌</button>` : ''}
            <button class="btn-edit-row" onclick="editTaskLineInline(${idx}, event)" title="快速編輯工單">✏️</button>
            <button onclick="deleteTask(${idx})" title="刪除此筆工單">✕</button>
          </div>
        `;

        row.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          selectTask(idx, true, displayStage === 3);
        };

        taskList.appendChild(row);
      });

      if (!sortableInstance) sortableInstance = new Sortable(taskList, {   // 只建立一次，之後換內容不用重建
        animation: 180,
        delay: 150,
        delayOnTouchOnly: true,
        touchStartThreshold: 3,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onStart: function() {
          if (navigator.vibrate) navigator.vibrate(35);
        },
        onEnd: function(evt) {
          const oldIdx = evt.oldIndex, newIdx = evt.newIndex;
          if (oldIdx === newIdx) return;
          const moved = tasks.splice(oldIdx, 1)[0];
          tasks.splice(newIdx, 0, moved);

          if (currentIndex === oldIdx) currentIndex = newIdx;
          else if (oldIdx < currentIndex && newIdx >= currentIndex) currentIndex--;
          else if (oldIdx > currentIndex && newIdx <= currentIndex) currentIndex++;

          saveTasks();
          renderTasks(false);
        }
      });

      renderLeafletCaseMarkers(fitMap);
    }

    function selectTask(idx, panToMarker = true, openPopup = false) {
      if (idx < 0 || idx >= tasks.length) return;
      currentIndex = idx;
      const t = tasks[currentIndex];
      if (t.code !== '📍地址導航') {
        t.code = sanitizeTaipowerCode(t.code);
      }

      const wgs = getTaskLatLng(t);
      const cleanNote = cleanAndFixAddress(t.note || '');

      if (wgs) {
        btnStartNav.href = `https://www.google.com/maps/dir/?api=1&destination=${wgs.lat},${wgs.lng}`;
        btnStartNav.style.opacity = '1';
        btnStartNav.style.pointerEvents = 'auto';

        if (currentViewMode === 'sv') {
          updateStreetView();
        } else {
          updateCaseMarkersSelectionStyle();
          if (panToMarker) map.flyTo([wgs.lat, wgs.lng], isCadOverlayEnabled ? 18 : 16, { duration: 0.4 });
          if (openPopup && caseMarkers[idx]) {
            caseMarkers[idx].openPopup();
          }
          if (isCadOverlayEnabled) {
            loadVisibleCadTiles();
          }
        }
      } else if (cleanNote) {
        const q = /(台中|臺中|縣|市)/.test(cleanNote) ? cleanNote : `台中市沙鹿區${cleanNote}`;
        btnStartNav.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
        btnStartNav.style.opacity = '1';
        btnStartNav.style.pointerEvents = 'auto';
      } else {
        btnStartNav.style.opacity = '0.4';
        btnStartNav.style.pointerEvents = 'none';
      }

      if (t.code === '📍地址導航' && cleanNote && !taskNavByCoords(t)) {
        const q = /(台中|臺中|縣|市)/.test(cleanNote) ? cleanNote : `台中市沙鹿區${cleanNote}`;
        btnStartNav.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
        btnStartNav.style.opacity = '1';
        btnStartNav.style.pointerEvents = 'auto';
      }

      document.querySelectorAll('.task-row').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    window.deleteTask = (idx) => {
      const snap = clone(tasks), date = activeDate;
      const removed = tasks[idx];
      tasks.splice(idx, 1);
      if (currentIndex >= tasks.length) currentIndex = Math.max(0, tasks.length - 1);
      saveTasks();
      renderTasks(false);
      if (tasks.length > 0) selectTask(currentIndex, false, false);
      showUndoToast(`已刪除 ${removed && removed.code !== '📍地址導航' ? removed.code : '工單'}`, () => restoreSnapshot(date, snap));
    };

    window.toggleTapSortMode = () => {
      if (tasks.length <= 1) return;
      isTapSortMode = !isTapSortMode;
      const btn = document.getElementById('tapSortBtn');
      if (isTapSortMode) {
        tapSortedOrder = [];
        btn.classList.add('sort-mode-active');
        mapBannerText.innerText = `🎯 請依序點擊地圖上的圖釘排工 (0/${tasks.length})`;
        mapBanner.style.display = 'flex';
      } else {
        btn.classList.remove('sort-mode-active');
        mapBanner.style.display = 'none';
      }
    };

    function handleTapSortClick(taskItem) {
      if (tapSortedOrder.includes(taskItem)) return;
      tapSortedOrder.push(taskItem);
      mapBannerText.innerText = `🎯 已排 ${tapSortedOrder.length}/${tasks.length} 件...`;

      const remaining = tasks.filter(t => !tapSortedOrder.includes(t));
      tasks = [...tapSortedOrder, ...remaining];

      if (tapSortedOrder.length === tasks.length) {
        toggleTapSortMode();
        currentIndex = 0;
      }
      saveTasks();
      renderTasks(false);
    }

    window.toggleAddPinMode = () => {
      isAddPinMode = !isAddPinMode;
      const btn = document.getElementById('addPinBtn');
      if (isAddPinMode) {
        btn.classList.add('pin-mode-active');
        mapBannerText.innerText = '📍 請點擊地圖任意位置查詢圖號或新增據點';
        mapBanner.style.display = 'flex';
      } else {
        btn.classList.remove('pin-mode-active');
        mapBanner.style.display = 'none';
      }
    };

    // ★ 手動標點：在工單列按 📌，再點地圖上的位置
    let pickTaskIdx = null;
    function endPickMode() {
      pickTaskIdx = null;
      mapBanner.style.display = 'none';
    }
    window.startPickLocation = (idx, ev) => {
      if (ev) ev.stopPropagation();
      if (idx < 0 || idx >= tasks.length) return;
      if (isAddPinMode) toggleAddPinMode();
      if (isTapSortMode) toggleTapSortMode();
      if (currentViewMode !== 'map') switchViewMode('map');
      pickTaskIdx = idx;
      mapBannerText.innerText = `📌 請點地圖上的位置來標記 #${idx + 1}（點此取消）`;
      mapBanner.style.display = 'flex';
      const t = tasks[idx];
      if (t && typeof t.lat === 'number') map.flyTo([t.lat, t.lng], Math.max(map.getZoom(), 17), { duration: 0.4 });
    };
    mapBanner.onclick = () => { if (pickTaskIdx !== null) endPickMode(); };
    map.on('click', (e) => {
      if (pickTaskIdx === null) return;
      const idx = pickTaskIdx, t = tasks[idx];
      endPickMode();
      if (!t) return;
      t.lat = e.latlng.lat; t.lng = e.latlng.lng; t.approx = false; t.manual = true;
      if (t.code === '📍地址導航') saveManualLocation(t.note, t.lat, t.lng);
      saveTasks();
      renderTasks(false);
      selectTask(idx, false, true);
    });

    // ===== 📏 量距離：點兩點，顯示直線距離（可拖曳端點微調；再點地圖重新量）=====
    let measureOn = false, measPts = [], measMarkers = [], measLine = null, measLabel = null;
    function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : (m >= 100 ? m.toFixed(0) : m.toFixed(1)) + ' m'; }
    function measRedraw() {
      if (measLine) { map.removeLayer(measLine); measLine = null; }
      if (measLabel) { map.removeLayer(measLabel); measLabel = null; }
      if (measPts.length < 2) return;
      const a = measPts[0], b = measPts[1];
      measLine = L.polyline([a, b], { color: '#f97316', weight: 3, dashArray: '6 5', interactive: false }).addTo(map);
      const mid = L.latLng((a.lat + b.lat) / 2, (a.lng + b.lng) / 2);
      measLabel = L.tooltip({ permanent: true, direction: 'top', offset: [0, -4], className: 'meas-label', interactive: false })
        .setLatLng(mid).setContent(fmtDist(map.distance(a, b))).addTo(map);
    }
    function measAddPoint(ll) {
      if (measPts.length >= 2) measClear();
      const i = measPts.length;
      measPts.push(ll);
      const mk = L.marker(ll, { draggable: true, icon: L.divIcon({ className: '', html: '<div class="meas-dot"></div>', iconSize: [0, 0] }), zIndexOffset: 1000 }).addTo(map);
      mk.on('drag', (e) => { measPts[i] = e.latlng; measRedraw(); });
      measMarkers.push(mk);
      measRedraw();
    }
    function measClear() {
      measMarkers.forEach(m => map.removeLayer(m));
      measMarkers = []; measPts = []; measRedraw();
    }
    window.toggleMeasureMode = () => {
      measureOn = !measureOn;
      const btn = document.getElementById('measureBtn');
      if (measureOn) {

      const msg = document.getElementById('bd-msg'), say = (t, ms) => { msg.textContent = t; msg.style.display = t ? 'block' : 'none'; if (ms) setTimeout(() => { msg.style.display = 'none'; }, ms); };
      say('⏳ 產生高解析圖片…');
      { const r0 = document.getElementById('leaflet-map').getBoundingClientRect(); if (Math.round(r0.width) !== BD.W || Math.round(r0.height) !== BD.H) bdLayout(); }
      bdSyncView();
      const f = Math.max(1, Math.min(4 * BD.dpr, 3600 / Math.max(BD.W, BD.H)));
      const v = { W: Math.round(BD.W * f), H: Math.round(BD.H * f), k: BD.k * f, minX: BD.minX, maxY: BD.maxY };
      const saved = { k: BD.k, fx: BD.fx }, code = BD.centerCode, lat = BD.lat;
      const out = document.createElement('canvas'); out.width = v.W; out.height = v.H;
      const g = out.getContext('2d');
      let note = '';
      try {
        g.fillStyle = '#fff'; g.fillRect(0, 0, v.W, v.H);
        const [base, cad] = await Promise.all([
          bdRenderBase(v).catch(() => ({ count: 0, tainted: false })),
          isCadOverlayEnabled ? bdRenderBg(bdTilesFor(v.minX, v.minX + v.W / v.k, v.maxY - v.H / v.k, v.maxY), (t) => say(t), v).catch(() => null) : Promise.resolve(null)
        ]);
        if (base.count && !base.tainted) g.drawImage(base.cv, 0, 0); else if (base.count) note = '（國土測繪底圖不允許存入圖片：這張只含圖資＋筆跡。要完整畫面請改用手機截圖）';
        if (cad && cad.got) { g.globalCompositeOperation = 'multiply'; g.drawImage(cad.cv, 0, 0); g.globalCompositeOperation = 'source-over'; cad.cv.width = 0; }
        base.cv && (base.cv.width = 0);
      } catch (e) { console.warn(e); }
      BD.k = v.k; BD.fx = f;                                   // 把筆跡以匯出解析度畫上去
      bdDrawAll(g, BD.shapes);
      BD.k = saved.k; BD.fx = saved.fx;
      const now = new Date(), pad = (n) => String(n).padStart(2, '0');
      const stamp = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      const fs = 12 * f, bar = 10 * v.k / Math.cos(lat * Math.PI / 180), m = fs * 0.8;
      g.font = `${fs}px monospace`; g.textBaseline = 'bottom'; g.lineJoin = 'round';
      g.textAlign = 'right'; g.lineWidth = fs * 0.25; g.strokeStyle = '#fff'; g.fillStyle = 'rgba(30,41,59,0.8)';
      g.strokeText(`${code}  ${stamp}`, v.W - m, v.H - m); g.fillText(`${code}  ${stamp}`, v.W - m, v.H - m);
      g.strokeStyle = '#111'; g.lineWidth = Math.max(2, f * 1.5); const by = v.H - m - fs;
      g.beginPath(); g.moveTo(m, by); g.lineTo(m + bar, by); g.moveTo(m, by - 5 * f); g.lineTo(m, by + 5 * f); g.moveTo(m + bar, by - 5 * f); g.lineTo(m + bar, by + 5 * f); g.stroke();
      g.textAlign = 'left'; g.fillStyle = '#111'; g.strokeStyle = '#fff'; g.lineWidth = fs * 0.25; g.strokeText('10 m', m + bar + 6 * f, by + fs * 0.5); g.fillText('10 m', m + bar + 6 * f, by + fs * 0.5);
      let blob = null;
      try { blob = await canvasToBlob(out); } catch (e) { blob = null; }
      out.width = out.height = 0;
      if (!blob) { say('⚠ 無法產生圖片，請改用手機截圖', 3500); return; }
      const name = `施工圖_${code}_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.png`;
      say(note ? note : '', note ? 3500 : 0);
      if (mode === 'share' && navigator.canShare) {
        const file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
        }
      }
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      say('✓ 已存成圖片（下載 / 相簿）' + note, 2200);
    };
    window.openBoard = () => {
      if (BD.on) { closeBoard(); return; }
      if (streetviewframe.style.display === 'block') { alert('街景模式下不能畫圖，請先回到地圖'); return; }
      bdEnsureDom();
      BD.on = true; BD.fx = 1; BD.tool = 'none';
      document.body.classList.add('bd-on'); document.getElementById('drawModeBtn').classList.add('tracking-active');
      document.getElementById('board').style.display = 'block';
      BD.zs = map.options.zoomSnap; map.options.zoomSnap = 0;           // 允許雙指縮放停在任意倍率
      try { BD.shapes = JSON.parse(localStorage.getItem(bdKey()) || '[]'); } catch (e) { BD.shapes = []; }
      BD.hist = []; BD.redo = []; BD.cur = null; BD.sel = null; BD.cache = null;
      bdTool(BD.tool); bdLayout(); bdPenUi();
    };
    window.closeBoard = () => {
      BD.on = false; BD.cur = null; BD.sel = null; bdDropCache();
      const r = document.getElementById('board'); r.style.display = 'none'; r.classList.remove('act');
      document.body.classList.remove('bd-on'); document.getElementById('drawModeBtn').classList.remove('tracking-active');
      bdPenPop(false);
      map.options.zoomSnap = (BD.zs === undefined ? 1 : BD.zs);
      map.setZoom(Math.round(map.getZoom()), { animate: false });

    };
    window.toggleMoreTools = () => {
      const el = document.getElementById('more-tools');
      const open = el.style.display !== 'flex';
      el.style.display = open ? 'flex' : 'none';
      document.getElementById('moreBtn').classList.toggle('tracking-active', open);
    };

    map.on('click', async (e) => {
      if (!isAddPinMode) return;
      toggleAddPinMode();
      const { lat, lng } = e.latlng;
      const code = coordToPowerCode(lat, lng);
      silentCopy(code);

      if (isCadOverlayEnabled) {
        loadVisibleCadTiles();
      }

      if (inspectMarker) map.removeLayer(inspectMarker);
      inspectMarker = L.marker([lat, lng], {
        icon: L.icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        })
      }).addTo(map);

      const road = await fetchCleanAddress(lat, lng);
      inspectMarker.bindTooltip(`<b>${code}</b> (已複製)${road ? ` | ${road}` : ''}`, {
        permanent: true, direction: 'top', offset: [0, -35], className: 'inspect-label'
      });

      inspectMarker.bindPopup(`
        <b>🔍 點位圖號解析</b><br>
        ${road ? `路名: <b>${road}</b><br>` : ''}
        圖號: <b style="color:#7e22ce;">${code}</b> (已複製)<br><br>
        <button onclick="openGoogleMaps(${lat}, ${lng})" style="background:#2563eb;padding:7px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;margin-bottom:6px;">🧭 Google 導航</button>
        <button onclick="promptAddCustomBase(${lat}, ${lng}, '${road || code}')" style="background:#7e22ce;padding:7px;border:none;border-radius:4px;color:white;font-weight:bold;cursor:pointer;width:100%;">⭐ 儲存為常用據點</button>
      `).openPopup();
    });

    window.triggerRouteAndLocate = (targetLat, targetLng) => {
      map.closePopup();
      if (!navigator.geolocation) { fetchRouteData(targetLat, targetLng); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => { updateLivePosition(pos, false); fetchRouteData(targetLat, targetLng); },
        () => fetchRouteData(targetLat, targetLng),
        { enableHighAccuracy: true, timeout: 3000 }
      );
    };

    async function fetchRouteData(targetLat, targetLng) {
      routeLayer.clearLayers();
      const token = ++currentRoutingToken;
      const startPt = userLatLng ? [userLatLng[0], userLatLng[1]] : [24.2303, 120.5654];
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${startPt[1]},${startPt[0]};${targetLng},${targetLat}?overview=full&geometries=geojson`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (token !== currentRoutingToken) return;
        if (data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          const poly = L.polyline(coords, { color: '#00f0ff', weight: 6, opacity: 0.9 }).addTo(routeLayer);
          map.fitBounds(poly.getBounds(), { padding: [50, 50] });
          return;
        }
      } catch (e) {}
    }

    function copyCurrentUserCode(e) {
      if (e) L.DomEvent.stopPropagation(e);
      if (!currentUserCode || !userMarker) return;
      silentCopy(currentUserCode);
      if (navigator.vibrate) navigator.vibrate(40);
      userMarker.setTooltipContent(`✅ 已複製 ${currentUserCode}`);
      setTimeout(() => {
        if (userMarker && currentUserCode) {
          userMarker.setTooltipContent(`📍 ${currentUserCode}`);
        }
      }, 1200);
    }

    function updateLivePosition(pos, forceCenter = false) {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      const prevCode = currentUserCode;
      currentUserCode = coordToPowerCode(userLatLng[0], userLatLng[1]);
      const accuracy = Math.min(pos.coords.accuracy || 20, 120);

      if (userMarker) {
        userMarker.setLatLng(userLatLng);
        if (currentUserCode !== prevCode) userMarker.setTooltipContent(`📍 ${currentUserCode}`);   // 圖號沒變就不更新文字
        userCircle.setLatLng(userLatLng);
        userCircle.setRadius(accuracy);
      } else {
        userCircle = L.circle(userLatLng, {
          radius: accuracy,
          color: '#3b82f6',
          weight: 1,
          fillColor: '#3b82f6',
          fillOpacity: 0.15,
          interactive: false
        }).addTo(map);

        const blueDotIcon = L.divIcon({
          className: 'google-blue-dot-wrapper',
          html: '<div class="google-blue-dot"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        userMarker = L.marker(userLatLng, {
          icon: blueDotIcon,
          zIndexOffset: 9000,
          interactive: true
        }).addTo(map);

        const userTooltip = userMarker.bindTooltip(`📍 ${currentUserCode}`, {
          permanent: true,
          direction: 'top',
          offset: [0, -10],
          className: 'user-loc-label',
          interactive: true
        });

        userMarker.on('click', copyCurrentUserCode);
        userTooltip.on('click', copyCurrentUserCode);
      }

      if (forceCenter && !(typeof BD !== 'undefined' && BD.on)) {
        map.panTo(userLatLng, { animate: true, duration: 0.4 });
      }
    }

    window.toggleLiveTracking = () => {
      const btn = document.getElementById('trackingBtn');
      if (watchPositionId !== null) {
        navigator.geolocation.clearWatch(watchPositionId);
        watchPositionId = null;
        btn.classList.remove('tracking-active');
        btn.innerText = '🚗';
        return;
      }
      if (!navigator.geolocation) return;
      btn.classList.add('tracking-active');
      btn.innerText = '🔴';
      isFirstFixOfSession = true;

      if (userLatLng && !(typeof BD !== 'undefined' && BD.on)) {
        map.panTo(userLatLng, { animate: true, duration: 0.4 });
        isFirstFixOfSession = false;
      }

      watchPositionId = navigator.geolocation.watchPosition(
        (pos) => {
          updateLivePosition(pos, isFirstFixOfSession);
          isFirstFixOfSession = false;
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    };

    // 連按兩下：📍清掉查詢圖釘、🚗停止定位並清掉車子標記
    let lastPinTap = 0, lastCarTap = 0;
    window.pinBtnTap = () => {
      const now = Date.now();
      if (now - lastPinTap < 400) {
        lastPinTap = 0;
        if (isAddPinMode) toggleAddPinMode();
        if (inspectMarker) { map.removeLayer(inspectMarker); inspectMarker = null; }
        return;
      }
      lastPinTap = now;
      toggleAddPinMode();
    };
    window.carBtnTap = () => {
      const now = Date.now();
      if (now - lastCarTap < 400) {
        lastCarTap = 0;
        if (watchPositionId !== null) toggleLiveTracking();       // 第一下已開啟 → 關掉
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
        if (userCircle) { map.removeLayer(userCircle); userCircle = null; }
        userLatLng = null; currentUserCode = '';
        return;
      }
      lastCarTap = now;
      toggleLiveTracking();
    };

    document.getElementById('btn-import').onclick = async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) { parseText(text); return; }
      } catch (err) {}
      showMultilineInputModal();
    };

    function showMultilineInputModal() {
      let modal = document.getElementById('manual-paste-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'manual-paste-modal';
        modal.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);`;
        modal.innerHTML = `
          <div style="background:#1e293b;border:1px solid #475569;border-radius:12px;width:100%;max-width:480px;padding:14px;display:flex;flex-direction:column;gap:10px;">
            <div style="font-weight:bold;color:#38bdf8;font-size:1rem;">📋 貼上派工單文字 (支援多行)</div>
            <textarea id="paste-textarea" style="width:100%;height:160px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#facc15;font-family:monospace;font-size:0.9rem;padding:8px;resize:none;outline:none;" placeholder="把整段圈選的文字貼在此處..."></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;">

              <button id="btn-confirm-paste" style="background:#2563eb;border:none;color:#fff;padding:8px 16px;border-radius:6px;font-weight:bold;">解析匯入</button>
            </div>

    // 清空：只清「目前這一天」，並提供 8 秒復原

    const calendarModal = document.getElementById('calendar-modal');

    document.getElementById('btn-month').onclick = () => {

    function renderCalendar() {
      calendarBody.innerHTML = '';

      ['日', '一', '二', '三', '四', '五', '六'].forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-weekday';

        calendarBody.appendChild(h);

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) calendarBody.appendChild(document.createElement('div'));

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (dateStr === todayKey) cell.classList.add('today');

    function updateActionSheet(dateStr) {
      document.getElementById('day-action-sheet').style.display = 'block';
      const tag = (dateStr === todayKey) ? ' (今日)' : (dateStr === activeDate ? ' (目前開啟)' : '');
      document.getElementById('sheet-date-text').innerText = `📅 ${dateStr}${tag}`;
      const records = monthLogs[dateStr] || [];

        btnCopy.style.opacity = btnDel.style.opacity = '0.35';

    document.getElementById('btn-action-load').onclick = () => {
      if (selectedDate !== activeDate) switchActiveDate(selectedDate);
      calendarModal.style.display = 'none';
    };

    document.getElementById('btn-action-copy').onclick = () => {
      const records = monthLogs[selectedDate];
      if (!records || records.length === 0) return;
      const text = `${selectedDate} 工單紀錄：\n` + records.map((t, idx) => `#${idx + 1} | ${t.time || ''} ${t.isND ? '[ND] ' : ''}${t.code} ${t.note}`).join('\n');
      silentCopy(text);
    };

    // 複製目前畫面到另一天：採「追加」，相同工單略過，絕不覆蓋原有紀錄
    document.getElementById('btn-action-save').onclick = () => {
      if (tasks.length === 0 || selectedDate === activeDate) return;
      const exist = monthLogs[selectedDate] || [];
      const sameKey = (a, b) => (a.code === '📍地址導航' || b.code === '📍地址導航')
        ? (a.code === b.code && a.note === b.note) : a.code === b.code;
      const toAdd = tasks.filter(t => !exist.some(e => sameKey(e, t)));
      if (toAdd.length === 0) { alert('這天已經有相同的工單了，沒有需要追加的。'); return; }
      const msg = exist.length > 0
        ? `${selectedDate} 已有 ${exist.length} 件。\n要追加 ${toAdd.length} 件進去嗎？（原有紀錄不會被覆蓋）`
        : `要把目前 ${toAdd.length} 件複製到 ${selectedDate} 嗎？`;
      if (confirm(msg)) {
        monthLogs[selectedDate] = [...exist, ...clone(toAdd)];
        persistLogs();
        renderCalendar();
        updateActionSheet(selectedDate);
      }
    };

    document.getElementById('btn-action-del').onclick = () => {
      if (!monthLogs[selectedDate]) return;
      if (confirm(`⚠️ 確定要刪除 ${selectedDate} 的所有工單紀錄嗎？`)) {
        if (selectedDate === activeDate) {
          tasks = [];
          currentIndex = 0;
          saveTasks();
          renderTasks();
          streetviewframe.src = 'about:blank';
        } else {
          delete monthLogs[selectedDate];
          persistLogs();
        }
        renderCalendar();
        updateActionSheet(selectedDate);
      }
    };

    renderTasks(true);
    if (tasks.length > 0) {
      selectTask(0, false, false);
    }
    updateDateBar();

    // 開啟 App 時，把之前沒定位成功的地址再試一次
    (async () => {
      for (const t of [...tasks]) {
        if (t.code === '📍地址導航' && typeof t.lat !== 'number' && t.note) {
          const ok = await geocodeTask(t);
          if (ok) renderTasks(false);
        }
      }
    })();

    setTimeout(() => {
      map.invalidateSize();
    }, 150);
  </script>
</body>
